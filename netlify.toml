# Netlify builds the web app in web/ with no extra settings in the Netlify UI.
# Required environment variable (set in Netlify, never in this file): ANTHROPIC_API_KEY
# Optional: APP_PASSWORD (when set, the app asks for this password)
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Include the generated team data (agents, skills, docs, knowledge) in the function bundle.
  included_files = ["netlify/generated/**"]

# Keep the app out of search engines and add basic security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
